name: Build executables

# Tests and builds standalone SPX-GC executables for Linux, macOS and Windows.
# - Every push/PR to master: tests, build + smoke test, archives kept as workflow artifacts.
# - Pushing a tag like v1.4.1: additionally publishes a GitHub Release with the archives.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each OS builds its own targets natively: macOS binaries must be
          # code-signed (ad-hoc) on a Mac, and native runners can smoke-test
          # the binaries that match their CPU.
          - os: linux
            runner: ubuntu-latest
            targets: linux-x64 linux-arm64
            smoke: linux-x64
          - os: macos
            runner: macos-latest # Apple Silicon
            targets: macos-x64 macos-arm64
            smoke: macos-arm64
          - os: windows
            runner: windows-latest
            targets: win-x64
            smoke: win-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: node scripts/build.js ${{ matrix.targets }}

      - name: Smoke test
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          for t in ${{ matrix.smoke }}; do
            node scripts/smoke-test.js "pkg-builds/spx-gc-$version-$t"
          done

      - name: Archive (Linux)
        if: matrix.os == 'linux'
        working-directory: pkg-builds
        run: for d in */; do tar -czf "${d%/}.tar.gz" "${d%/}"; done

      - name: Archive (macOS)
        if: matrix.os == 'macos'
        working-directory: pkg-builds
        # ditto keeps the executable bit and the code signature
        run: for d in */; do ditto -c -k --keepParent "${d%/}" "${d%/}.zip"; done

      - name: Archive (Windows)
        if: matrix.os == 'windows'
        working-directory: pkg-builds
        shell: pwsh
        run: Get-ChildItem -Directory | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath "$($_.Name).zip" }

      - uses: actions/upload-artifact@v4
        with:
          name: spx-gc-${{ matrix.os }}
          path: |
            pkg-builds/*.tar.gz
            pkg-builds/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SPX-GC $GITHUB_REF_NAME" \
            --generate-notes
